[toolchain]
anchor_version = "0.30.0"
solana_version = "1.18.26"

[features]
resolution = true
skip-lint = false

# ---------------------------------------------------------------------------
# Canonical declared program ID.
#
# This value MUST match:
#   * declare_id!(...) in programs/nummus_vault/src/lib.rs
#   * the generated IDL metadata.address after `anchor build`
#   * the deployed program address on every cluster
#   * the Turnkey Smart Contract Interface upload
#
# The matching program keypair (anchor/target/deploy/nummus_vault-keypair.json)
# is intentionally NOT committed. It is a private key. Regenerate it with
# scripts/keys.sh only in an environment authorized to deploy. For mainnet the
# upgrade authority MUST be transferred to the Turnkey 4-of-6 root policy
# BEFORE any user funds enter the vault.
# ---------------------------------------------------------------------------
[programs.localnet]
nummus_vault = "BaRfuBXneEAf6eFh3e7ECqNax8NyAmWHb3SkMWtSPUZw"

[programs.devnet]
nummus_vault = "BaRfuBXneEAf6eFh3e7ECqNax8NyAmWHb3SkMWtSPUZw"

[programs.mainnet]
nummus_vault = "BaRfuBXneEAf6eFh3e7ECqNax8NyAmWHb3SkMWtSPUZw"

[registry]
url = "https://api.apr.dev"

[provider]
# Default to localnet. Devnet/mainnet are selected explicitly by the deploy
# scripts via ANCHOR_PROVIDER_URL / --provider.cluster. Nothing here can point
# a normal build at a live cluster.
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"

[test.validator]
url = "https://api.mainnet-beta.solana.com"
rpc_port = 18999

# Clone the real Orca Whirlpool program into the local validator so CPI account
# and program-id checks exercise the genuine program layout during localnet
# integration tests.
[[test.validator.clone]]
address = "whirLbMiicVdio4qvUfM5KAg6Ct8VwpYzGff3uctyCc"
