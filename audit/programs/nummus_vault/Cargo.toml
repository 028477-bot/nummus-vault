[package]
name = "nummus_vault"
version = "0.1.0"
description = "Turnkey-controlled Solana SOL custody vault with constrained Orca Whirlpool liquidity"
edition = "2021"
license = "UNLICENSED"

[lib]
crate-type = ["cdylib", "lib"]
name = "nummus_vault"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
# Enables the unit-test-only helpers. Never enabled in a deploy build.
test-helpers = []

[dependencies]
anchor-lang = { version = "=0.30.0", features = ["init-if-needed"] }
solana-security-txt = "1.1.1"
uint = { version = "0.9.5", default-features = false }

[dev-dependencies]
